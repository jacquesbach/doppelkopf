name: Deploy

# Bei jedem Push auf "main" (und per Hand): erst alle Tests, dann Dateien per SSH auf den Server legen,
# dort .env aus den GitHub-Secrets schreiben und `docker compose up -d --build` ausführen.
# Einrichtung Schritt für Schritt: docs/DEPLOYMENT.md
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Zwei Deploys nie gleichzeitig; ein laufender wird nicht abgebrochen, sondern der nächste wartet.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/build-and-test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Secrets/Variablen können unter Settings > Environments > production liegen (dort geht auch eine manuelle Freigabe).
    environment: production
    env:
      # --- Secrets ---
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      # --- Variablen (nicht geheim; Standardwerte, wenn nicht gesetzt) ---
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/doppelkopf' }}
      FRONTEND_PORT: ${{ vars.FRONTEND_PORT || '8080' }}
      BACKEND_PORT: ${{ vars.BACKEND_PORT || '8181' }}
      BACKEND_BIND: ${{ vars.BACKEND_BIND || '127.0.0.1' }}
      CORS_ORIGINS: ${{ vars.CORS_ORIGINS || '*' }}
      CREATE_PER_HOUR: ${{ vars.CREATE_PER_HOUR || '30' }}
      COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME || 'doppelkopf' }}
      # Domain der Website (canonical, sitemap.xml, robots.txt, Link-Vorschau)
      SITE_URL: ${{ vars.SITE_URL || 'https://doppelkopf.cc' }}
      # --- Betreiberangaben für Impressum und Datenschutz (Variablen, nicht im Repository; docs/DEPLOYMENT.md) ---
      LEGAL_NAME: ${{ vars.LEGAL_NAME }}
      LEGAL_STREET: ${{ vars.LEGAL_STREET }}
      LEGAL_CITY: ${{ vars.LEGAL_CITY }}
      LEGAL_COUNTRY: ${{ vars.LEGAL_COUNTRY || 'Deutschland' }}
      LEGAL_EMAIL: ${{ vars.LEGAL_EMAIL }}
      LEGAL_PHONE: ${{ vars.LEGAL_PHONE }}
      LEGAL_VAT_ID: ${{ vars.LEGAL_VAT_ID }}
      LEGAL_HOSTING_PROVIDER: ${{ vars.LEGAL_HOSTING_PROVIDER }}
      LEGAL_HOSTING_REGION: ${{ vars.LEGAL_HOSTING_REGION }}
      LEGAL_REGISTRAR: ${{ vars.LEGAL_REGISTRAR }}
    steps:
      - uses: actions/checkout@v4

      - name: Eingaben prüfen
        run: |
          missing=0
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS SECRET_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name fehlt (Settings > Secrets and variables > Actions)"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1
          case "$DEPLOY_PATH" in /*) ;; *) echo "::error::DEPLOY_PATH muss ein absoluter Pfad sein"; exit 1;; esac
          if ! printf '%s' "$DEPLOY_PATH" | grep -Eq '^/[A-Za-z0-9._/-]+$'; then echo "::error::DEPLOY_PATH enthält ungültige Zeichen"; exit 1; fi
          for name in FRONTEND_PORT BACKEND_PORT SSH_PORT CREATE_PER_HOUR; do
            if ! printf '%s' "${!name}" | grep -Eq '^[0-9]{2,5}$'; then echo "::error::$name muss eine Zahl sein"; exit 1; fi
          done
          # Werte landen in einer .env mit einfachen Anführungszeichen: diese und Zeilenumbrüche sind darin nicht möglich.
          for name in SECRET_KEY ADMIN_PASSWORD CORS_ORIGINS SITE_URL; do
            case "${!name}" in *"'"*|*$'\n'*) echo "::error::$name darf kein ' und keinen Zeilenumbruch enthalten"; exit 1;; esac
          done
          if ! printf '%s' "$SITE_URL" | grep -Eq '^https://[A-Za-z0-9.-]+(:[0-9]{2,5})?$'; then
            echo "::error::SITE_URL muss mit https:// beginnen und darf keinen Pfad und keinen Schrägstrich am Ende haben (z. B. https://doppelkopf.cc)"; exit 1
          fi
          # Impressum: entweder alle Pflichtangaben oder keine (dann Testdaten)
          legal_set=0; legal_missing=""
          for name in LEGAL_NAME LEGAL_STREET LEGAL_CITY LEGAL_EMAIL; do
            if [ -n "${!name}" ]; then legal_set=1; else legal_missing="$legal_missing $name"; fi
          done
          if [ "$legal_set" = 1 ] && [ -n "$legal_missing" ]; then echo "::error::Impressum unvollständig, es fehlen die Variablen:$legal_missing"; exit 1; fi
          if [ "$legal_set" = 0 ]; then echo "::warning::Keine LEGAL_*-Variablen gesetzt: Impressum und Datenschutz zeigen Testdaten. Vor dem öffentlichen Betrieb ausfüllen (docs/DEPLOYMENT.md)."; fi
          if [ "${#SECRET_KEY}" -lt 32 ]; then echo "::error::SECRET_KEY ist zu kurz (mindestens 32 Zeichen)"; exit 1; fi
          if [ -n "$ADMIN_PASSWORD" ] && [ "${#ADMIN_PASSWORD}" -lt 10 ]; then echo "::error::ADMIN_PASSWORD braucht mindestens 10 Zeichen"; exit 1; fi

      - name: SSH vorbereiten
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONF
          Host deploy
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          CONF
          ssh deploy 'echo "SSH ok: $(whoami)@$(hostname)"; docker compose version'

      - name: Dateien auf den Server kopieren
        run: |
          ssh deploy "mkdir -p '$DEPLOY_PATH'"
          rsync -az --delete --human-readable \
            --exclude='.git/' --exclude='.github/' --exclude='node_modules/' --exclude='dist/' \
            --exclude='.env' --exclude='.env.*' --exclude='backend/instance/' --exclude='/legal/' \
            --exclude='__pycache__/' --exclude='.pytest_cache/' --exclude='e2e/' \
            ./ "deploy:$DEPLOY_PATH/"

      - name: .env auf dem Server schreiben
        run: |
          {
            printf "COMPOSE_PROJECT_NAME='%s'\n" "$COMPOSE_PROJECT_NAME"
            printf "APP_ENV='production'\n"
            printf "SECRET_KEY='%s'\n" "$SECRET_KEY"
            printf "ADMIN_PASSWORD='%s'\n" "$ADMIN_PASSWORD"
            printf "FRONTEND_PORT='%s'\n" "$FRONTEND_PORT"
            printf "BACKEND_PORT='%s'\n" "$BACKEND_PORT"
            printf "BACKEND_BIND='%s'\n" "$BACKEND_BIND"
            printf "CORS_ORIGINS='%s'\n" "$CORS_ORIGINS"
            printf "CREATE_PER_HOUR='%s'\n" "$CREATE_PER_HOUR"
            printf "SITE_URL='%s'\n" "$SITE_URL"
            # Anzeige im Betreiber-Dashboard (Systemstatus): Git-Stand und Zeitpunkt dieses Deploys
            printf "APP_VERSION='%s'\n" "${GITHUB_SHA::7}"
            printf "DEPLOYED_AT='%s'\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | ssh deploy "umask 077 && cat > '$DEPLOY_PATH/.env'"

      - name: Betreiberangaben (Impressum/Datenschutz) schreiben
        run: |
          # legal.json liegt nur auf dem Server (nicht im Repository, nicht im Image) und wird von nginx ausgeliefert.
          # jq maskiert Sonderzeichen sicher; der Ordner muss vor "docker compose up" dem Deploy-Benutzer gehören.
          ssh deploy "mkdir -p '$DEPLOY_PATH/legal' && chmod 755 '$DEPLOY_PATH/legal'"
          if [ -n "$LEGAL_NAME" ]; then
            jq -n \
              --arg name "$LEGAL_NAME" --arg street "$LEGAL_STREET" --arg city "$LEGAL_CITY" --arg country "$LEGAL_COUNTRY" \
              --arg email "$LEGAL_EMAIL" --arg phone "$LEGAL_PHONE" --arg vatId "$LEGAL_VAT_ID" \
              --arg hostingProvider "$LEGAL_HOSTING_PROVIDER" --arg hostingRegion "$LEGAL_HOSTING_REGION" --arg registrar "$LEGAL_REGISTRAR" \
              '{name:$name, street:$street, city:$city, country:$country, email:$email, phone:$phone, vatId:$vatId,
                hostingProvider:$hostingProvider, hostingRegion:$hostingRegion, registrar:$registrar}' \
              | ssh deploy "umask 022 && cat > '$DEPLOY_PATH/legal/legal.json.tmp' && mv '$DEPLOY_PATH/legal/legal.json.tmp' '$DEPLOY_PATH/legal/legal.json'"
            echo "legal.json geschrieben."
          else
            ssh deploy "rm -f '$DEPLOY_PATH/legal/legal.json'"
            echo "Keine Betreiberangaben gesetzt: Die Seite zeigt Testdaten."
          fi

      - name: Bauen und starten
        run: |
          ssh deploy "cd '$DEPLOY_PATH' && docker compose up -d --build --remove-orphans --wait --wait-timeout 180"

      - name: Gesundheitstest
        run: |
          for attempt in 1 2 3 4 5 6; do
            if ssh deploy "curl -fsS --max-time 5 http://127.0.0.1:$FRONTEND_PORT/api/health"; then echo; echo "Server antwortet."; exit 0; fi
            echo "Versuch $attempt fehlgeschlagen, warte …"; sleep 5
          done
          echo "::error::Nach dem Deploy antwortet /api/health nicht."
          ssh deploy "cd '$DEPLOY_PATH' && docker compose ps && docker compose logs --tail=60"
          exit 1

      - name: Seiten und Suchmaschinen-Dateien prüfen
        run: ssh deploy "bash -s -- http://127.0.0.1:$FRONTEND_PORT" < scripts/smoke-test.sh

      - name: Alte Images aufräumen
        run: ssh deploy "docker image prune -f"

      - name: Schlüssel entfernen
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config ~/.ssh/known_hosts
