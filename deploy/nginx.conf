# Vorlage: Beim Containerstart ersetzt nginx ${BACKEND_PORT} durch den Wert aus der Umgebung (.env).
# Alle anderen $-Variablen (z. B. $host) bleiben unveraendert.

# Protokolle ohne volle IP-Adresse: IPv4 ohne die letzte Zahl (203.0.113.77 -> 203.0.113.0), IPv6 auf die ersten 48 Bit gekuerzt.
# Alles andere wird zu 0.0.0.0. (Regex mit {…} stehen in Anfuehrungszeichen, sonst liest nginx sie als Block.)
map $remote_addr $remote_addr_anon {
  "~^(?P<ip>[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3})\.[0-9]{1,3}$"                                   $ip.0;
  "~^(?P<ip>[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}):"                               $ip::;
  "~^(?P<ip>[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4})::"                                               $ip::;
  "~^(?P<ip>[0-9a-fA-F]{1,4})::"                                                                $ip::;
  default                                                                                       0.0.0.0;
}

# Kein Referrer, keine Cookies, keine volle IP. Die Protokolle rotiert Docker (siehe docker-compose.yml, "logging").
log_format anon '$remote_addr_anon [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';

# Content Security Policy: Skripte, Schriften, Bilder und Verbindungen nur vom eigenen Server (es gibt keine Drittdienste).
# style-src erlaubt Inline-Stile, weil die Oberflaeche einzelne style="..."-Attribute setzt; Skripte duerfen NICHT inline laufen.
# connect-src nennt den eigenen Host ausdruecklich fuer WebSocket (Socket.IO), weil aeltere Browser 'self' dafuer nicht gelten lassen.
# (add_header erbt nicht in Locations mit eigenem add_header: Die Zeile steht deshalb in jeder Location, die HTML ausliefert.)
map $uri $csp {
  default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws://$http_host wss://$http_host; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  access_log /var/log/nginx/access.log anon;

  # Kleinere Dateien = schnellere Seite (Ladezeit zaehlt fuer die Suchmaschinen-Bewertung).
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css text/javascript application/javascript application/json application/manifest+json application/xml image/svg+xml text/plain;

  # Steht vor diesem Container noch ein Proxy auf dem Server (z. B. Caddy/nginx fuer HTTPS), kommen alle Anfragen von einer
  # Docker-Adresse. Dann gilt die Besucheradresse aus X-Forwarded-For - aber nur, wenn der direkte Aufrufer in einem
  # privaten Docker-Netz (172.16.0.0/12) liegt. Direkt aus dem Internet gesendete Header werden ignoriert.
  set_real_ip_from 172.16.0.0/12;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Gleicher Ursprung fuer API und Socket.IO: keine CORS-Probleme, ein Port nach aussen.
  location /api/ {
    proxy_pass http://backend:${BACKEND_PORT};
    proxy_set_header Host $host;
    # haengt die Adresse des direkten Aufrufers an; das Backend nimmt (TRUST_PROXY=1) den letzten Eintrag
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
  location /socket.io/ {
    proxy_pass http://backend:${BACKEND_PORT};
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  # ---- Seiten (Single-Page-App) --------------------------------------------------------------------------------------------
  # Jede Seite hat ihre eigene HTML-Datei mit passendem Titel, canonical und Klartext (erzeugt beim Build, scripts/seo-build.mjs).
  # Unbekannte Adressen liefern die Hülle app.html mit dem Status 404 (kein "Soft 404"), Tisch/Admin zusaetzlich noindex.
  # Die Adressen entsprechen src/lib/router.js; kommt dort eine Seite hinzu, hier ebenfalls eintragen.
  location = / {
    try_files /index.html =404;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache" always;
  }
  location ~ ^/regeln/?$ {
    try_files /regeln/index.html =404;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache" always;
  }
  location ~ ^/impressum/?$ {
    try_files /impressum/index.html =404;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache" always;
  }
  location ~ ^/datenschutz/?$ {
    try_files /datenschutz/index.html =404;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache" always;
  }
  location ~ "^/(neu|admin|beitreten|beitreten/[A-Za-z0-9]{3,12}|tisch/[A-Za-z0-9]{3,12})/?$" {
    try_files /app.html =404;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  # Die HTML-Dateien sind nur ueber die Seiten-Adressen oben erreichbar, nicht doppelt unter /index.html oder /regeln/index.html.
  location ~ /index\.html$ {
    return 404;
  }
  error_page 404 /app.html;
  location = /app.html {
    internal;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  # ---- Dateien --------------------------------------------------------------------------------------------------------------
  # Vite haengt einen Hash an den Dateinamen: ein Jahr Cache ist sicher.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # Betreiberangaben fuer Impressum/Datenschutz (vom Deploy geschrieben, siehe docs/DEPLOYMENT.md). Nie zwischenspeichern, nie indexieren.
  location = /legal/legal.json {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex" always;
  }
  # robots.txt, sitemap.xml, Icons, Vorschaubild, manifest
  location / {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
  }
}
