<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fffdf5" />

    <!-- ==== Suchmaschinen ====
         Der Platzhalter für die Domain wird beim Build aus SITE_URL eingesetzt (siehe .env.example). Titel, Beschreibung, robots,
         canonical und og:* ersetzt scripts/seo-build.mjs je Seite (aus src/lib/seo.js); hier stehen die Werte der Startseite. -->
    <title>Doppelkopf online spielen – kostenlos | DOPPELKOPF.CC</title>
    <meta name="description" content="Doppelkopf online kostenlos spielen: nach DDV-Turnierregeln, mit Hausregeln, privaten Tischen per Link und Bots. Ohne Anmeldung, ohne Werbung." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta name="application-name" content="DOPPELKOPF.CC" />
    <meta name="apple-mobile-web-app-title" content="DOPPELKOPF.CC" />

    <!-- Vorschau beim Teilen (Messenger, soziale Netzwerke) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DOPPELKOPF.CC" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:title" content="Doppelkopf online spielen – kostenlos | DOPPELKOPF.CC" />
    <meta property="og:description" content="Doppelkopf online kostenlos spielen: nach DDV-Turnierregeln, mit Hausregeln, privaten Tischen per Link und Bots. Ohne Anmeldung, ohne Werbung." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DOPPELKOPF.CC – Doppelkopf online spielen, ohne Schnickschnack" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Doppelkopf online spielen – kostenlos | DOPPELKOPF.CC" />
    <meta name="twitter:description" content="Doppelkopf online kostenlos spielen: nach DDV-Turnierregeln, mit Hausregeln, privaten Tischen per Link und Bots. Ohne Anmeldung, ohne Werbung." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />

    <!-- Symbole: ICO (Google-Suche, ältere Browser), SVG (moderne Browser), PNG (iOS) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Strukturierte Daten (schema.org) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "%SITE_URL%/#website",
            "url": "%SITE_URL%/",
            "name": "DOPPELKOPF.CC",
            "inLanguage": "de-DE"
          },
          {
            "@type": "WebApplication",
            "@id": "%SITE_URL%/#app",
            "url": "%SITE_URL%/",
            "name": "DOPPELKOPF.CC",
            "description": "Doppelkopf im Browser: nach DDV-Turnierregeln, mit Hausregeln, privaten Tischen per Einladungslink und Bots als Mitspielern.",
            "applicationCategory": "GameApplication",
            "genre": "Kartenspiel",
            "operatingSystem": "Alle Systeme mit aktuellem Webbrowser",
            "browserRequirements": "Benötigt JavaScript",
            "inLanguage": "de-DE",
            "isAccessibleForFree": true,
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
            "isPartOf": { "@id": "%SITE_URL%/#website" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!-- Inhalt für Suchmaschinen und Besucher ohne JavaScript. Der Build (scripts/seo-build.mjs) ersetzt ihn je Seite. -->
    <noscript id="static-content">
      <p style="font-family:system-ui,sans-serif;padding:24px">DOPPELKOPF.CC braucht JavaScript. Bitte aktiviere es in deinem Browser.</p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
